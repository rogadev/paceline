version: 2
updates:
  # Keeps the SHA-pinned actions current; each bump is its own PR through CI.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # Preset majors must match the changelog writer semantic-release bundles
      # (preset 10 needs writer 9; semantic-release 25 ships writer 8).
      # test/release-config.test.js fails if they drift. Bump both together by hand.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
