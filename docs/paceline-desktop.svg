<title id="t">paceline in the Claude desktop app</title>
<desc id="d">The Code tab of the Claude desktop app, with Claude partway through a task on a project called api-server. The paceline line sits in a band just above the prompt box: the project and branch, the model, effort, today’s budget bar, the week at 67 of 100, and the warning out ~Fri because the week is forecast to run out before it resets.</desc>
