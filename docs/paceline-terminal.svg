<title id="t">paceline in a Claude Code terminal window</title>
<desc id="d">A Windows Terminal window running Claude Code on a project called api-server. Claude is partway through a task, and the paceline line sits in the band just above the prompt box: the project and branch, the model, effort, today’s budget bar with 5 of 14 points spent, the week at 63 of 100 with 3 days left, and the session time.</desc>
